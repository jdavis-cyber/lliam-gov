name: Governance Gates

# Security mechanisms and reference-profile regressions for repository changes.
# This workflow does not certify a deployed system or renew example approvals.
on:
  # ci.yml invokes these checks on PRs and main pushes. Manual runs use the
  # same regression checks. Production audit cron remains a separate script.
  workflow_call: {}
  workflow_dispatch:

permissions:
  contents: read

env:
  HERMES_CONFIG: cli-config.gov.yaml
  GOV_CI_DIR: ci/governance-ci-gates

jobs:
  # GATE 7 — prohibited-skill (godmode) preflight (LG-CH-06 / LG-SC-01)
  prohibited-skills:
    name: Prohibited-skill (godmode) gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Assert prohibited skills denied in the gov overlay
        run: bash "${GOV_CI_DIR}/prohibited_skills_gate.sh" "${HERMES_CONFIG}"

  # GATE — baseline-drift gate (LG-CH-03 / LG-CH-09), fail-closed on critical drift
  baseline-drift:
    name: Baseline-drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Compare effective gov config to baseline-critical-keys (Phase 0)
        run: |
          python "${GOV_CI_DIR}/baseline_drift_gate.py" \
            --overlay "${HERMES_CONFIG}" \
            --baseline policy/governed/baseline-critical-keys.yaml \
            --phase P0

  # GATE 2 — dependency pin + hash check (LG-SS-01)
  deps-hash:
    name: Dependency pin + hash gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # 10.3.3
      - name: Assert deps pinned with hashes + upper bounds
        run: bash "${GOV_CI_DIR}/deps_hash_gate.sh"

  # GATE — audit-chain integrity (LG-AU-08, P1.3): tamper-evidence detective
  # control. Self-tests the verifier (PASS on a good chain, FAIL on a tampered
  # record) from a bare checkout, then runs the real gate against the config-
  # resolved ledger (a no-op in CI where no production ledger exists). The same
  # script is the host cron detective control.
  audit-chain:
    name: Audit-chain integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - name: Self-test the chain verifier (PASS on good, FAIL on tamper)
        run: python "${GOV_CI_DIR}/audit_chain_selftest.py"
      - name: Run the audit-chain gate against the resolved ledger (no-op if absent)
        run: python "${GOV_CI_DIR}/audit_chain_gate.py"

  # Verify valid, expired and non-waivable cases without requiring the dated
  # reference operator exceptions to remain current for repository maintenance.
  separation-of-duties:
    name: SoD policy regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # 10.3.3
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install locked test environment
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev
      - name: Test SoD rules and example expiry boundaries
        run: scripts/run_tests.sh tests/governance/test_sod_check.py

  # P3.4 — deterministic full-tree supply-chain hard block (LG-SS-04).
  supply-chain-artifacts:
    name: Supply-chain artifact gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - name: Block executable install/startup artifacts
        run: python "${GOV_CI_DIR}/supply_chain_gate.py" .

  # P3.4 — lockfile-derived SBOM and policy-derived AI-BOM (LG-SS-05).
  sbom-ai-bom:
    name: Generate SBOM + AI-BOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml
      - name: Generate build evidence
        run: python "${GOV_CI_DIR}/generate_bom.py" build/governance-bom
      - name: Retain BOM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lliam-gov-bom
          path: build/governance-bom/
          if-no-files-found: error

  # GATE 8 — path-freeze guardrail (LG-SD-01) — PR only (needs base/head)
  path-freeze:
    name: Path-freeze guardrail
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Assert no frozen path renamed or deleted
        run: |
          python "${GOV_CI_DIR}/path_freeze_gate.py" \
            --manifest "${GOV_CI_DIR}/path-freeze-manifest.yaml" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
