name: Governance Gates

# Lliam-GOV additive CI/CD governance gates (Phase 0 subset).
#
# PATH-FREEZE: this is a NEW standalone workflow. It does NOT rename, replace, or
# edit any existing workflow (ci.yml / supply-chain-audit.yml / osv-scanner.yml).
# It runs the four Phase-0 governance gates whose helper scripts live under
# ci/governance-ci-gates/. Later phases extend this (SBOM, secret-scan,
# provenance/signing, config-policy lint) per
# 03_Implementation_Plan/baseline_overlay/ci/governance-ci-gates.md.
#
# Capability-preserving: the drift + prohibited-skill gates are no-ops on a
# non-gov profile; the path-freeze guard only blocks RENAME/DELETE of frozen
# paths (additive overlays always pass).

on:
  # Driven by the ci.yml orchestrator (which runs on pull_request + push) so the
  # gates feed the single required `all-checks-pass` check. Kept callable +
  # manually dispatchable; the standalone pull_request/push triggers are removed
  # to avoid duplicate runs once wired into ci.yml.
  workflow_call: {}
  workflow_dispatch:
  # LG-AU-08 scheduled detective control: the audit-chain gate runs daily as a
  # cron job. In the CI checkout there is no production ledger (the job self-
  # tests the verifier instead); a host/prod cron runs the same script against
  # the real $LLIAM_HOME/logs/agent-audit.log. Other gates skip cleanly on
  # schedule (path-freeze is PR-only; the rest are idempotent).
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

env:
  HERMES_CONFIG: cli-config.gov.yaml
  GOV_CI_DIR: ci/governance-ci-gates

jobs:
  # GATE 7 — prohibited-skill (godmode) preflight (LG-CH-06 / LG-SC-01)
  prohibited-skills:
    name: Prohibited-skill (godmode) gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.13" }
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Assert prohibited skills denied in the gov overlay
        run: bash "${GOV_CI_DIR}/prohibited_skills_gate.sh" "${HERMES_CONFIG}"

  # GATE — baseline-drift gate (LG-CH-03 / LG-CH-09), fail-closed on critical drift
  baseline-drift:
    name: Baseline-drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.13" }
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Compare effective gov config to baseline-critical-keys (Phase 0)
        run: |
          python "${GOV_CI_DIR}/baseline_drift_gate.py" \
            --overlay "${HERMES_CONFIG}" \
            --baseline docs/governance/baseline-critical-keys.yaml \
            --phase P0

  # GATE 2 — dependency pin + hash check (LG-SS-01)
  deps-hash:
    name: Dependency pin + hash gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # 8.3.0
      - name: Assert deps pinned with hashes + upper bounds
        run: bash "${GOV_CI_DIR}/deps_hash_gate.sh"

  # GATE — audit-chain integrity (LG-AU-08, P1.3): tamper-evidence detective
  # control. Self-tests the verifier (PASS on a good chain, FAIL on a tampered
  # record) from a bare checkout, then runs the real gate against the config-
  # resolved ledger (a no-op in CI where no production ledger exists). The same
  # script is the host cron detective control.
  audit-chain:
    name: Audit-chain integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.13" }
      - name: Self-test the chain verifier (PASS on good, FAIL on tamper)
        run: python "${GOV_CI_DIR}/audit_chain_selftest.py"
      - name: Run the audit-chain gate against the resolved ledger (no-op if absent)
        run: python "${GOV_CI_DIR}/audit_chain_gate.py"

  # GATE 8 — path-freeze guardrail (LG-SD-01) — PR only (needs base/head)
  path-freeze:
    name: Path-freeze guardrail
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.13" }
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Assert no frozen path renamed or deleted
        run: |
          python "${GOV_CI_DIR}/path_freeze_gate.py" \
            --manifest "${GOV_CI_DIR}/path-freeze-manifest.yaml" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
