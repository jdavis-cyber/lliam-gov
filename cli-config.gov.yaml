# Lliam-GOV — HARDENED GOVERNANCE OVERLAY  (cli-config.gov.yaml)
# =============================================================================
#
# | Field          | Value                                                     |
# |----------------|-----------------------------------------------------------|
# | Document       | cli-config.gov.yaml — Hardened Governance Overlay (CUI)    |
# | Owner          | Lliam-GOV Program                                          |
# | Classification | CUI//SP-PRIV (template — mark per instance)                |
# | Version        | 0.1 DRAFT                                                  |
# | Approval       | Pending                                                    |
#
# APPROVED BASELINE PIN (LG-CH-01) — fill at each signed save point:
#   baseline_git_tag:   gov-P0-good   (Phase 0 verify gate, 2026-06-30 — annotated tag)
#   baseline_git_hash:  <the commit gov-P0-good points at on harden/phase-0-baseline>
# The LG-CH-03 startup drift check pins the running config to this tag/hash.
#
# -----------------------------------------------------------------------------
# WHAT THIS FILE IS
# -----------------------------------------------------------------------------
# The single, version-controlled, fail-closed configuration OVERLAY that moves
# Lliam-GOV (a fork of Lliam-GOV, Nous Research, MIT) from its shipped
# permissive defaults to the CUI posture floor: NIST SP 800-171 r3 / CMMC L2.
# It is the documented secure baseline for control LG-CH-01.
#
# HOW IT LOADS  (ADDITIVE — no existing module renamed; PATH-FREEZE honored)
#   Selected at runtime via the EXISTING env var HERMES_CONFIG (already in the
#   allowlist at lliam_cli/config.py:198). The additive selector
#   lliam_cli/config._gov_overlay_path() resolves it and deep-merges this file
#   OVER the home config.yaml (highest precedence below the managed layer), then
#   lliam_cli/posture_resolver.resolve() coerces the fail-open guards to
#   fail-closed. Writes still target the home config.yaml — the agent never
#   clobbers this version-controlled overlay.
#       export HERMES_CONFIG=<path>/cli-config.gov.yaml
#   Rollback (config-only, reversible): unset/repoint HERMES_CONFIG, or check out
#   the previous signed git tag of this file. No frozen path is ever renamed.
#
# BUILD ORDER (this file grows across the Phase-0..2 steps — each step ACTIVATES
# its own section here; everything below the active block is scaffolded as
# step-tagged comments so the structure is visible key-for-key without
# prematurely enabling half-built enforcement). Capability-preserving throughout.
# =============================================================================


# =============================================================================
# [ACTIVE @ P0.1]  0. MASTER POSTURE SWITCH  +  FAIL-OPEN -> FAIL-CLOSED COHERENCE
#    Controls: LG-CH-02 (strict-posture switch), LG-CH-01 (documented baseline),
#              LG-CH-09 (startup posture findings become blocking)
#    Consumed by: lliam_cli/posture_resolver.py (additive module)
# -----------------------------------------------------------------------------
# `security.posture: strict` is the single coherent switch. The resolver forces
# the keys below to their fail-closed values after every config merge, so the
# secure state cannot be reached by accidental half-configuration. The keys are
# ALSO set explicitly here so the posture is auditable as one flat artifact (the
# resolver still wins if any is edited). Low-side deployments simply do not load
# this overlay; their permissive defaults are untouched.
# =============================================================================
security:
  posture: strict             # [additive] SHIPPED DEFAULT: (none/implicit permissive)

  tirith_enabled: true        # config.py:2415  DEFAULT True   (confirm-pinned)
  tirith_fail_open: false     # config.py:2418  DEFAULT True  -> OVERRIDE false (scanner fails closed)
  allow_private_urls: false   # config.py:2413  DEFAULT False  (confirm-pinned; SSRF/metadata stay blocked)
  allow_lazy_installs: false  # config.py:2438  DEFAULT True  -> OVERRIDE false (no runtime PyPI installs)
  redact_secrets: true        # config.py:2414  DEFAULT True   (confirm-pinned; LG-DP-03 secret redaction ON)
  deny_on_no_approver: true   # [additive] high-risk actions fail closed when no approver is reachable
  posture_findings_blocking: true  # [additive] LG-CH-09 — startup posture findings BLOCK (also stamped by posture_resolver; pinned explicitly so the flat artifact + drift gate are self-contained)

  # [ACTIVE @ P1.4 — LG-IA]  MANAGED CREDENTIALS  (kept in THIS security block —
  # a second top-level `security:` key elsewhere would silently override it)
  no_default_credentials: true   # [additive @ P1.4] LG-IA-05: startup check refuses known default/placeholder credential values (fail-closed on strict)
  accounts:                      # [additive @ P1.4] LG-IA-01: managed-account inventory of record; reconciled at startup vs the secrets-CLI enumeration (live reconcile = remediation pass)
    - profile: default
      provider: bedrock-govcloud
      owner: jdavis
      status: authorized

  # [ACTIVE @ P1.5 — LG-IA]  OPERATOR + ENDPOINT AUTHENTICATION
  # Consumed by the NEW fail-closed enforce_control_plane_auth_at_startup gate
  # (lliam_cli/security_audit_startup.py), wired at gateway startup. Kept in THIS
  # security block (a second top-level security: would drop the P0 posture).
  api_server_key_required: true  # [additive @ P1.5] LG-IA-11: a network-accessible API server with no API_SERVER_KEY REFUSES to start (RCE gate). Loopback-only binds are unaffected.
  require_operator_auth: true    # [additive @ P1.5] LG-IA-06: no shared/anonymous operator sessions on a networked control plane (config-of-record; dashboard_auth enforces token/oauth)
  require_mfa: true              # [additive @ P1.5] LG-IA-07 config-of-record: dashboard/ACP login via an MFA-enforcing IdP (dashboard.oauth.client_id → IdP). Runtime IdP wiring is a deployment step; the startup posture check asserts MFA-capable auth for any network bind.
  require_tls: true              # [additive @ P1.5] LG-IA-08: provider/MCP endpoints over VERIFIED TLS (ssl_guard). A disabled trust-store verification REFUSES to start under strict.
  require_authenticated_approver: true   # [additive @ P1.6] LG-GV-05: an anonymous/non-interactive high-risk approval fails closed (couples to deny_on_no_approver); every approval/denial/override must carry an authenticated dashboard_auth principal. Runtime wiring of the principal into the approval.decision record is remediation-pass scope (the P1.2 subject seam + taxonomy already support it).
  cert_pinning:                  # [additive @ P1.5] LG-IA-08 config-of-record: per-high-side-endpoint SPKI pins checked in the egress wrapper (ssl_guard verifies the trust store but does not pin). Pin list provisioned per deployment; enforcement is remediation-pass scope.
    enabled: false
  device_auth:                   # [additive @ P1.5] LG-IA-09: computer_use/browser are already policy-disabled in the CUI baseline (agent.disabled_toolsets + security.tool_denylist, P0.4); enrolled-host allowlist for any re-enable is config-of-record.
    computer_use_enrolled_hosts: []

  # [ACTIVE @ P0.3]  SKILL ENABLEMENT POLICY MIRROR  (LG-SC-01/02/03/06, LG-AZ-02)
  # Consumed by the NEW tools/tool_policy.py gate. The detailed, reviewable policy
  # is policy/skills-allowlist.yaml; these keys mirror it for one-artifact audit.
  skill_policy:
    mode: enforce                  # [additive] hard-refuse the named denylist + deny_tags
    unlisted_disposition: log      # [additive] non-allowlisted skills LOGGED, not blocked (capability-preserving)
    path: policy/skills-allowlist.yaml   # [additive] detailed policy artifact
    constrain_mobile_code: true    # [additive] LG-SC-06: inline_shell off (above) + sandbox/browser gating (CH-05/04)
  require_signed_skills: true      # [additive] LG-SC-03: clean provenance + signature for third-party high-impact exec
  require_ast_audit: true          # [additive] LG-SC-02: ast_scan_path() must pass before load
  require_provenance: true         # [additive] LG-SC-03: no clean provenance => no high-impact exec
  skill_allowlist:                 # [additive] mirror of policy/skills-allowlist.yaml security.skill_allowlist
    - name: pdf
      source: builtin
    - name: xlsx
      source: builtin
    - name: docx
      source: builtin

  # [ACTIVE @ P0.4; PDP wired @ P2.1]  LEAST-PRIVILEGE TOOL ENABLEMENT + PER-CALL
  # PDP  (LG-AZ-01/02/03/06/07/10/11/12, LG-RM-08)
  # Mirror of policy/tool-risk-policy.yaml. computer_use + browser are policy-
  # disabled in the CUI baseline (also enforced via agent.disabled_toolsets below
  # which removes them from the resolved toolset). tool_denylist is read by the
  # tools/tool_policy.py enablement gate. As of P2.1 the same module's per-call
  # PDP (evaluate_call/pdp_gate) enforces the four-tier ladder at the dispatch
  # chokepoint (tool_executor before_call seams + model_tools direct funnel).
  tool_risk_policy:
    enabled: true                  # [additive] per-call PDP ACTIVE under strict posture (P2.1)
    policy_path: policy/tool-risk-policy.yaml   # [additive] reviewable tier policy of record
    default_disposition: deny      # [additive] unmatched action class -> deny (fail-closed)
    fail_closed: true              # [additive] on policy parse/eval error -> deny
  max_mutating_calls:              # [additive @ P2.1] LG-AZ-10 mirror of policy budgets (PDP reads the policy file; this key is the one-artifact audit mirror)
    per_turn: 25
    per_session: 200

  # [ACTIVE @ P2.4]  DATA PROTECTION + DLP TAINT-GATE  (LG-DP-01/02/04/07/08/10/11)
  # Consumed by the NEW agent/data_protection.py. CUI/PII classification arms
  # the session DLP taint at the tool-result funnel; once CUI is exposed the PDP
  # escalates egress/external-send to HITL (LG-DP-10) so CUI is not freely
  # exfiltrated. Redaction (LG-DP-03/05) and TLS (LG-DP-06) are the P0/P1
  # surfaces (privacy.redact_pii above, security.require_tls). At-rest key store
  # is <lliam_home>/keys, on the file_safety write-denylist (LG-DP-08).
  data_protection:
    cui_redaction: true            # [additive] LG-DP-04: CUI/PII pattern pack active on the high side
    dlp_taint_gate: true           # [additive] LG-DP-10: CUI-exposed session escalates egress to HITL
    at_rest_encryption: true       # [additive] LG-DP-07: Fernet at-rest wrapper for CUI/audit blobs
    result_retention_ttl_seconds: 86400   # [additive] LG-DP-11: tool-result retention cap (24h)
    egress_allowlist: []           # [additive] LG-DP-10 sink allowlist (destination policy of record = P2.5 egress.*)

  # [ACTIVE @ P2.5]  NETWORK EGRESS BOUNDARY  (LG-NE-01..06)
  # Consumed by the NEW tools/egress_policy.py (check_egress), layered OVER the
  # existing url_safety SSRF floor + website_policy. Deny-by-default destination
  # allowlist (policy/egress-allowlist.yaml); the metadata/private-IP floor is
  # unconditional (is_always_blocked_url). The squid isolation enclave
  # (deploy/docker-compose.gov.override.yml) is the connection-level mirror.
  egress:
    mode: allowlist                # [additive] allowlist | deny_all (air-gap, LG-NE-06)
    policy_path: policy/egress-allowlist.yaml   # [additive] LG-NE-01 destination policy of record
    new_domain_disposition: deny   # [additive] deny | hitl_approve — new hosts denied by default
    proxy_required: true           # [additive] LG-NE-04/05 squid enclave is the gov default
    fail_closed: true              # [additive] parse/eval error -> deny
  website_policy:
    mode: allowlist                # [additive] LG-NE-03 allowlist mode on web/browser tools
    allow_domains_from: policy/egress-allowlist.yaml
    fail_closed: true

  # [ACTIVE @ P3.1]  APPROVED-PROVIDER ALLOWLIST  (LG-MP-01/02/03/04/08)
  # Consumed by the NEW lliam_cli/provider_allowlist.py validator + the
  # fail-closed startup gate enforce_provider_allowlist_at_startup (wired at
  # gateway startup next to the control-plane gate). Restricts CUI inference
  # routing to vetted US/FedRAMP/local endpoints on every routing path; a
  # non-allowlisted provider/host refuses to start. No-op unless strict + the
  # enforce flag (capability-preserving on low-side).
  provider_allowlist_enforce: true       # [additive] LG-MP-01/02 fail-closed enforcement ON
  provider_allowlist_path: policy/provider-allowlist.yaml   # [additive] policy of record
  allowed_providers: [lmstudio, ollama, vllm, bedrock]      # [additive] mirror of allowlist ids
  allowlist_paths: [primary, fallback, moa, auxiliary, delegation]   # [additive] LG-MP-02 all paths
  high_sensitivity_local_only: true      # [additive] LG-MP-04 clamp high-sensitivity CUI to local
  local_provider_preference: [lmstudio, ollama, vllm]       # [additive] LG-MP-04 preference order
  allowlist_review_cadence_days: 90      # [additive] LG-MP-08 provider posture re-validation cadence

  # [ACTIVE @ P3.2]  MODEL INTEGRITY + ATTESTATION  (LG-MP-05/06/07)
  # Consumed by the NEW agent/attestation.py. A model needs a card before it is
  # CUI-eligible (LG-MP-05); a signed manifest is verified before high-impact
  # actions (LG-MP-06); only safe serialization formats load (LG-MP-07).
  require_model_card: true               # [additive] LG-MP-05: uncarded model refused for CUI
  model_cards_path: docs/governance/model-cards/model-cards.yaml   # [additive] card index of record
  safe_serialization_only: true          # [additive] LG-MP-07: allow safetensors/gguf; deny code-executing formats
  model_hash_verify: true                # [additive] LG-MP-07: verify artifact hash at load
  model_manifest_path: model_manifest.yaml   # [additive] LG-MP-06 signed manifest of record
  trusted_signers:                       # [additive] LG-MP-06 signer id -> key (KEY provisioned out-of-repo)
    lliam-gov-signer: "${LLIAM_GOV_SIGNING_KEY}"

  # [ACTIVE @ P3.3]  MCP & SKILL SUPPLY-CHAIN VETTING  (LG-SC-03/04/05/07/08/09)
  # Consumed by the NEW tools/mcp_allowlist.py. Deny-by-default for unlisted MCP
  # servers; block shell-egress/persistence IOC command shapes; least-privilege
  # scope + default-deny write; TLS required on HTTP transports; unsigned/
  # unvetted third-party skills refused. require_signed_skills was set at P0.3.
  mcp_allowlist_enforce: true            # [additive] LG-SC-07 deny-by-default MCP vetting ON
  mcp_allowlist_path: policy/mcp-allowlist.yaml   # [additive] approved-server policy of record
  mcp_require_tls: true                  # [additive] LG-SC-08 TLS/mTLS on HTTP MCP transports
  supplier_vetting_register: docs/governance/supplier-vetting-register.md   # [additive] LG-TP-03
  tool_allowlist: []               # [additive] LG-AZ-02 (empty = no positive tool allowlist yet)
  tool_denylist:                   # [additive] LG-AZ-11/AZ-02: refuse these capabilities for CUI
    - computer_use
    - browser

  # [ACTIVE @ P0.5]  INPUT-INTEGRITY & PATH-SAFETY  (treat untrusted = hostile)
  # Reviewable policy: policy/input-trust-policy.yaml. Consumed by the NEW
  # tools/input_integrity.py gate + the EXISTING sanitizer/scanner/path modules.
  # tirith_fail_open is already pinned false above (P0.1) — LG-PI-05.
  schema_validation:               # [additive] LG-PI-03: reject malformed/oversized tool/MCP schemas before binding
    mode: reject                   #   reject | coerce  (CUI floor: reject)
    max_schema_bytes: 65536
  input_trust:                     # [additive] LG-PI-01/02: untrusted-by-default + sanitize/delimit
    enabled: true
    policy_path: policy/input-trust-policy.yaml
    untrusted_sources: [web, file, tool_result, mcp, rag]
    sanitize: true                 #   message_sanitization always-on (pinned)
    delimit_untrusted: true
  smart_approval_guard:            # [additive] LG-PI-07: harden guard; constrain to allowable actions
    hardened: true
    out_of_scope_disposition: approve
  inbound_screening:               # [additive] LG-PI-08: AI-generated/low-credibility screening (detect-and-log)
    enabled: true
    mode: log
  memory_poisoning_defense:        # [additive] LG-MC-01: scan content before persistent memory write
    enabled: true
    mode: block                    #   block | placeholder | log  (CUI floor: block)
    scope: strict
  path_traversal_validation:       # [additive] LG-AZ-05: pin path_security on for file/skill/cron ops
    enabled: true
    fail_closed: true

  # [ACTIVE @ P0.6]  SOFTWARE SUPPLY-CHAIN PINNING + AIR-GAP  (LG-SS-01, LG-SS-07)
  # The dependency supply chain is pinned at build time: pyproject.toml exact
  # pins (==) / bounded ranges (<next_major) + uv.lock with 1798 sha256 hashes
  # (both committed). allow_lazy_installs:false (pinned in P0.1 above) makes
  # tools/lazy_deps.ensure() refuse any RUNTIME install. See evidence pack
  # docs/governance/dependency-pinning.md and the pin-bump change-record.
  require_hashed_install: true     # [additive] LG-SS-01: install path must be hash-verified (uv sync --locked / pip --require-hashes)
  # allow_lazy_installs: false     #  LG-SS-07 — already pinned in the P0.1 block above (no runtime PyPI installs)
  supply_chain:                    # [additive] supply-chain evidence + enforcement pointers
    pinned_lockfile: uv.lock
    lockfile_hash_algo: sha256
    require_upper_bounds: true     #   enforced by .github/workflows/supply-chain-audit.yml (existing)
    change_record: docs/governance/change-record.md   #   LG-SS-01: any pin bump requires an entry
    osv_fail_on: high             #   [declared] LG-SS-02 scheduled/blocking OSV scan threshold (wired Phase 3)


# =============================================================================
# [ACTIVE @ P0.2]  FLIP PERMISSIVE DEFAULTS TO THE CUI FLOOR
#    Control: LG-CH-07 (flip permissive defaults to strict for CUI)
#    Cross-refs: LG-DP-04 (PII), LG-HO-04 (staged write-approval), LG-SC-02/06
# -----------------------------------------------------------------------------
# These keys ALL already exist in Lliam-GOV DEFAULT_CONFIG and are consumed by
# SHIPPED code today — flipping them is capability-preserving:
#   * write_approval only DELAYS/STAGES memory & skill writes (to <HERMES_HOME>/
#     pending/{memory,skills}) for review; it never drops them. Ordinary file
#     writes (the file_write tool) are NOT gated by these.
#   * redact_pii only masks PII in the context sent to providers.
#   * guard_agent_created only turns on AST scanning of AGENT-authored skills.
# Each line: SHIPPED DEFAULT -> OVERRIDE (control).
# =============================================================================
privacy:
  redact_pii: true            # config.py:1908  DEFAULT False -> OVERRIDE true   (LG-CH-07 / LG-DP-04: redact PII to providers)

memory:
  write_approval: true        # config.py:2037  DEFAULT False -> OVERRIDE true   (LG-CH-07 / LG-HO-04: stage memory writes for review)
  # [ACTIVE @ P2.6]  MEMORY GOVERNANCE  (LG-MC-02/04/05/06/07)
  # Consumed by the NEW agent/memory_governance.py. Partition per session/
  # identity so cross-session memory does not leak (MC-02); critical writes
  # route to HITL (MC-04); purpose-limited retention TTL + PII exclusion
  # (MC-05); secure purge + between-task context reset (MC-06/07).
  governance:
    partition_per_session: true      # [additive] LG-MC-02: per-identity/session partition
    critical_write_hitl: true        # [additive] LG-MC-04: critical memory writes -> HITL
    retention_ttl_seconds: 604800    # [additive] LG-MC-05: 7-day purpose-limited retention
    exclude_pii: true                # [additive] LG-MC-05: PII-tagged content not persisted
    secure_purge: true               # [additive] LG-MC-06: overwrite-then-unlink on purge
    reset_context_between_tasks: true # [additive] LG-MC-07: wipe partition between unrelated tasks

skills:
  write_approval: true        # config.py:2176  DEFAULT False -> OVERRIDE true   (LG-CH-07 / LG-HO-04: stage skill writes for review)
  guard_agent_created: true   # config.py:2164  DEFAULT False -> OVERRIDE true   (LG-CH-07 / LG-SC-02: AST-scan agent-authored skills)
  inline_shell: false         # config.py:2151  DEFAULT False  (confirm-pinned;  LG-SC-06: no host inline-shell pre-exec)

  # ---------------------------------------------------------------------------
  # [ACTIVE @ P0.3]  LEAST-FUNCTIONALITY DENYLIST  (LG-SC-01 / LG-CH-04 / LG-HO-03)
  # Offensive/jailbreak optional-skills denied for the CUI profile. Enforced via
  # the NEW tools/tool_policy.py gate unioned into get_disabled_skill_names() (so
  # they are refused at discovery, slash-command registration, and prompting).
  # Detailed reviewable policy: policy/skills-allowlist.yaml.
  # ---------------------------------------------------------------------------
  disabled:                   # config.py skills.disabled  SHIPPED DEFAULT: [] -> deny offensive set
    - godmode                 #   JAILBREAK — MANDATORY deny (LG-SC-01 / LG-HO-03)
    - obliteratus             #   weight-abliteration / uncensoring — MANDATORY deny (LG-SC-01)
    - web-pentest             #   active web exploitation, dual-use — deny by default
    - sherlock                #   OSINT account-enumeration, dual-use — deny by default
    - oss-forensics           #   forensics/IR, dual-use — deny by default (REVIEW-to-allow)
  deny_tags:                  # [additive] intent-based denial of re-vendored/renamed offensive skills (LG-SC-01/02)
    - jailbreak
    - uncensoring
    - safety-bypass
    - refusal-removal
    - abliteration
    - guardrail-removal
    - prompt-injection-offense


# =============================================================================
# [ACTIVE @ P0.4]  SANDBOXED EXECUTION BACKEND  (LG-CH-05)
# -----------------------------------------------------------------------------
# Run shell/code (and the file tools, which wrap the terminal backend's
# execute()) inside a hardened container instead of on the host. config.py:1095
# ships "local"; the CUI baseline OVERRIDES to "docker". terminal.backend is
# bridged to the TERMINAL_ENV env var by apply_terminal_config_to_env at startup,
# so the terminal tool runs every command in the sandbox. The LG-CH-03 drift gate
# (later) flags terminal.backend: local as CRITICAL drift for a CUI profile.
# =============================================================================
terminal:
  backend: docker             # config.py:1095  DEFAULT "local" -> OVERRIDE "docker" (sandboxed exec)
  timeout: 180                # config.py:1098  (confirm-pinned)


# =============================================================================
# [ACTIVE @ P0.4]  LEAST-PRIVILEGE TOOLSET PROFILE  (LG-AZ-03 / LG-AZ-11)
# -----------------------------------------------------------------------------
# agent.disabled_toolsets (config.py:1091; read in lliam_cli/tools_config.py
# _get_platform_tools L1653, applied LAST so it overrides everything) removes
# these toolsets from the resolved enabled set for EVERY platform. computer_use
# (desktop/OS automation) and browser (interactive web automation) are OFF in the
# CUI baseline; re-enable per mission via the deviation register + JIT grant +
# approval. terminal/file/web/search remain available (shell is sandboxed above).
# =============================================================================
agent:
  disabled_toolsets:          # config.py:1091  DEFAULT [] -> disable high-risk toolsets for CUI
    - computer_use            #   LG-AZ-11: desktop/OS automation OFF in CUI baseline
    - browser                 #   LG-AZ-03: interactive web automation OFF in CUI baseline


# [ACTIVE @ P2.1]  RUNAWAY-LOOP HARD STOPS  (LG-AZ-12)
# Shipped default is hard_stop_enabled: false (soft warnings only) so
# interactive sessions keep flowing; the gov overlay flips hard stops ON so a
# genuine runaway/non-progress loop halts via ToolGuardrailDecision.should_halt.
# Complements the PDP's mutating-call budgets (security.max_mutating_calls).
tool_loop_guardrails:
  warnings_enabled: true      # config.py:1329  DEFAULT True   (confirm-pinned)
  hard_stop_enabled: true     # config.py:1330  DEFAULT False -> OVERRIDE true (LG-AZ-12)
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 12   # tuned up from shipped 5 — long legitimate tasks must not trip it


# =============================================================================
# [ACTIVE @ P1.1]  APPEND-ONLY HASH-CHAINED AUDIT LEDGER  (LG-AU-01..07, AU-09)
# -----------------------------------------------------------------------------
# Consumed by the NEW additive module agent/governance_audit.py (the emitter
# core). The ledger is JSONL at $HERMES_HOME/logs/agent-audit.log — OUTSIDE the
# workspace and on the agent/file_safety.py write-denylist (LG-AU-07), so the
# agent's own write tools cannot reach its own record. Each record carries
# prev_hash + record_hash (sha256 over canonical bytes; genesis = 64 zeros).
# Redaction-on-write (LG-AU-05) reuses the Phase-0 force-path redaction; masked
# values retain a stable content_hash for correlation. fail_closed gates the
# HIGH-RISK scope only (LG-AU-09): if the record cannot be written the action
# must not run; low-risk events degrade to a logged warning (bounded trade).
# Chokepoint wiring = P1.2 (AI-517); verify_chain + startup/CI = P1.3 (AI-518).
# =============================================================================
audit:
  ledger_enabled: true               # [additive] LG-AU-01: governance ledger ON in the gov profile (shipped default: no ledger)
  ledger_path: "$HERMES_HOME/logs/agent-audit.log"   # [additive] LG-AU-01/07: outside workspace, write-denied
  hash_algo: sha256                  # [additive] LG-AU-01: chain algorithm pinned
  # LG-AU-05 redaction-on-write is UNCONDITIONAL in agent/governance_audit.py —
  # deliberately no config knob (a runtime-disableable redaction boundary is
  # not a boundary; post-review hardening removed the earlier key).
  fail_closed: true                  # [additive] LG-AU-09: audit-write failure blocks gated actions
  fail_closed_scope: [mutating, privileged, egress, high_impact]   # [additive] LG-AU-09 gated risk classes
  time_granularity_ms: true          # [additive] LG-AU-06: UTC sub-second stamps + monotonic seq in-chain
  protect_path: true                 # [additive] LG-AU-07: ledger dir on the file_safety write-denylist
  write_denied: true                 # [additive] LG-AU-07: denial of a write into the audit path is itself auditable
  # ---- [ACTIVE @ P1.2] dispatch chokepoint + unified accountability ----
  chokepoint_required: true          # [additive @ P1.2] LG-AU-02: both dispatch paths emit tool.dispatch pre-execution
  on_unrecorded: block               # [additive @ P1.2] LG-AU-09 at the gate: unrecordable high-risk dispatch is blocked
  unify_dashboard_auth: true         # [additive @ P1.2] LG-AU-10: audit_log() events forwarded into the chained ledger
  unify_acp: true                    # [additive @ P1.2] LG-AU-10/MC-03: operator-subject contextvar + trace stamped into records; full ACP principal plumb lands with P1.5 operator authn (AI-520)
  # ---- [ACTIVE @ P1.3] chain-integrity verification (LG-AU-08) ----
  verify_on_startup: true            # [additive @ P1.3] LG-AU-08: verify_chain() at process start (gateway startup seam)
  verify_fail_action: block          # [additive @ P1.3] LG-AU-08: a chain break under strict posture refuses high-risk start (fail-closed); advisory profiles alert-only
  events:                            # [additive] LG-AU-03: auditable event set (L2 floor; catalog in the AU spec §2)
    - tool.dispatch
    - tool.result
    - approval.decision
    - provider.call
    - mcp.call
    - policy.violation
    - config.load
    - skill.load
    - mcp.load
    - secret.access
    - memory.write
    - session.start
    - session.stop
    - agent.lifecycle
    - killswitch.activate
    - security.error


# =============================================================================
# [ACTIVE @ P1.4]  AGENT IDENTITY + MANAGED CREDENTIALS  (LG-IA-01..05, IA-10)
# -----------------------------------------------------------------------------
# LG-IA-02 agent NPE identity is computed by the NEW additive module
# agent/agent_identity.py (instance_id = sha256(code+config+toolset+model)) and
# stamped into every audit record's `actor` (agent/governance_audit_hooks.py).
# The binding inputs + algorithm + review-by are recorded in
# docs/governance/agent_identity.yaml. LG-IA-03 per-profile credential isolation
# is the EXISTING agent/secret_scope.py, activated fail-closed by
# gateway.multiplex_profiles below. LG-IA-01/04/05 land as the managed-account
# inventory + secret-source config-of-record + the no-default-credential startup
# check; heavier runtime enforcement (live secrets-CLI reconcile, Bitwarden
# migration, full delegation-context module + max_spawn_depth enforcement) is
# flagged for the cross-phase remediation pass (see P1.4 report).
# =============================================================================
identity:
  bind_instance: true                # [additive @ P1.4] LG-IA-02: derive + stamp the NPE instance_id into audit actor
  record: docs/governance/agent_identity.yaml   # [additive @ P1.4] the identity binding record (evidence)

gateway:
  multiplex_profiles: true           # [additive @ P1.4] LG-IA-03: set_multiplex_active(True) at gateway startup → get_secret() FAILS CLOSED on unscoped reads (no process-global credential union)

secrets:
  bitwarden:
    enabled: false                   # [additive @ P1.4] LG-IA-04 config-of-record: managed secret source. false until a project/collection id is provisioned; POA&M tracks per-provider migration off plaintext .env (which stays write-denied by file_safety)
  # (no_default_credentials lives under `security:` — the check reads
  #  security.no_default_credentials; a duplicate here would be unread.)

delegation:
  max_spawn_depth: 3                 # [additive @ P1.4] LG-IA-10 config-of-record: bound the operator→Lliam→sub-agent delegation chain; runtime enforcement in delegate_tool is remediation-pass scope

# =============================================================================
# [ACTIVE @ P1.6]  ROLES / RACI / SEPARATION-OF-DUTIES  (LG-GV-04/05)
# -----------------------------------------------------------------------------
# governance.role_bindings maps the named roles in docs/governance/roles.yaml to
# authenticated dashboard_auth principals. The SoD gate (ci/governance-ci-gates/
# sod_check.py) enforces the separation_of_duties rules in roles.yaml against
# these bindings and fails closed on any conflict. The acting ENGINEER is the
# Lliam-GOV NPE agent (its LG-IA-02 instance identity), distinct from the human
# APPROVER, so Approver ≠ Engineer holds by construction.
# security.require_authenticated_approver makes an anonymous/non-interactive
# high-risk approval fail closed (LG-GV-05, couples to deny_on_no_approver).
# =============================================================================
governance:
  role_bindings:
    caio: jdavis@agency.mil                 # [additive @ P1.6] LG-GV-05
    isso: jdavis@agency.mil                 #   ISSO co-held by the operator in eval (tracked)
    ai_risk_owner: jdavis@agency.mil
    approver: jdavis@agency.mil             #   human HITL approver (dashboard_auth principal)
    engineer: "npe:lliam-gov"               #   the acting party is the NPE agent — Approver ≠ Engineer ✓
    auditor: auditor@independent.mil        #   independent of approver/engineer/risk (SoD)
    killswitch_owner: jdavis@agency.mil
  # ---------------------------------------------------------------------------
  # [ACTIVE @ P4.1]  TOP-MANAGEMENT POLICY IDENTITY + REGISTER BINDINGS
  #   Controls: LG-GV-01 (policy of record), LG-GV-03 (regulatory register),
  #             LG-GV-06 (go/no-go authorization), LG-GV-10 (CAIO waivers)
  #   Consumed by: lliam_cli/security_audit_startup.py
  #                enforce_governance_artifacts_at_startup (fail-closed under
  #                strict; complete no-op low-side) and
  #                ci/governance-ci-gates/regulatory_reconciliation_gate.py.
  # Register paths resolve relative to this overlay's directory (the repo root).
  # ---------------------------------------------------------------------------
  policy_id: LG-POL-001                    # [additive @ P4.1] LG-GV-01 policy of record
  policy_version: "1.0"                    # [additive @ P4.1] must match ai-policy.md §11
  policy_approved_by: jdavis@agency.mil    # [additive @ P4.1] CAIO (role_bindings.caio)
  policy_review_date: 2027-07-16           # [additive @ P4.1] past-due -> fail-closed (strict)
  policy_path: docs/governance/ai-policy.md
  authorization_id: LG-ATO-2026-001        # [additive @ P4.1] LG-GV-06 go/no-go of record
  registers:                               # [additive @ P4.1] register bindings of record
    regulatory: docs/governance/regulatory-register.yaml     # LG-GV-03
    authorization: docs/governance/authorization-record.yaml # LG-GV-06
    waiver: docs/governance/waiver-register.yaml             # LG-GV-10
    deviation: docs/governance/deviation-register.yaml       # LG-CH-08 (P0.7)
    # [additive @ P4.2] risk & applicability layer (LG-RM-01..07,09)
    control_catalog: docs/governance/control-catalog.yaml    # LG-RM-04 machine canon
    soa: docs/governance/SoA.md                              # LG-RM-04
    poam: docs/governance/poam.yaml                          # LG-RM-07
    threat_risk: docs/governance/threat-risk-register.yaml   # LG-RM-02
    determinations: docs/governance/high-impact-determinations.yaml  # LG-RM-06
    impact_assessment: docs/governance/ai-impact-assessment.md       # LG-RM-05
    risk_process: docs/governance/risk-assessment-process.md         # LG-RM-01
    halt_runbook: docs/governance/halt-rollback-runbook.md           # LG-RM-09
    # [additive @ P4.3] boundary/inventory + SSP layer (LG-IN-01/04..07)
    ssp: docs/governance/SSP.md                                      # LG-IN-07
    boundary_scope: docs/governance/boundary-scope.md                # LG-IN-01/04/05/06
    traceability: docs/governance/traceability-171r3.yaml            # LG-IN-07
# NOTE: LG-IA-01 managed-account inventory (security.accounts) and the
# LG-IA-05 no-default-credential switch (security.no_default_credentials) live
