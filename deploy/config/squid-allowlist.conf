# =============================================================================
# squid-allowlist.conf — Lliam-GOV egress dstdomain allowlist  [P2.5 / LG-NE-04/05]
# =============================================================================
# Network-layer mirror of policy/egress-allowlist.yaml approved_destinations.
# Deny-by-default: only the dstdomains below may be reached; everything else,
# including any attempt to connect by raw IP (which would bypass an app-layer
# host check), is denied at the proxy. Keep this file in lockstep with the YAML
# allowlist — the P2.5 verify and the review cadence reconcile the two.
# =============================================================================

# --- Allowlisted destinations (mirror of approved_destinations) --------------
acl allowed_dstdomains dstdomain bedrock-runtime.us-gov-west-1.amazonaws.com
acl allowed_dstdomains dstdomain api.anthropic.com
acl allowed_dstdomains dstdomain api.github.com
acl allowed_dstdomains dstdomain github.com
acl allowed_dstdomains dstdomain .nist.gov
acl allowed_dstdomains dstdomain .cisa.gov

# --- Only CONNECT to 443 (TLS) is permitted (LG-DP-06) -----------------------
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports

# --- Block connections addressed by raw IP (force name-based allowlisting) ----
# A destination reached by literal IP cannot be matched against a dstdomain and
# must not slip past the allowlist. (SSRF/metadata IPs are also blocked at the
# app layer by tools/url_safety.is_always_blocked_url.)
acl to_ipv4_literal dst_as_regex ^([0-9]{1,3}\.){3}[0-9]{1,3}$
http_access deny to_ipv4_literal

# --- Deny-by-default ---------------------------------------------------------
http_access allow allowed_dstdomains
http_access deny all

# Squid listens only on the proxy_side network; no ICP/SNMP, minimal footprint.
http_port 3128
