# agent_identity.yaml — Agent NPE Instance Identity binding record (LG-IA-02).
#
# Purpose: the assessor evidence for LG-IA-02 — documents WHAT inputs bind an
# agent runtime instance to its identity, the derivation algorithm, and how the
# identity is used. The identity itself is COMPUTED at runtime by the additive
# module agent/agent_identity.py and stamped into every audit record's `actor`
# field; this file is the human/assessor-readable specification of that binding.
#
# Review-by: 2026-10-11 (or at any change to the binding inputs / algorithm).

schema: lg-ia/1
control: LG-IA-02
owner: Lliam-GOV Program
classification: CUI//SP-PRIV   # template — mark per instance

# The identity is a stable sha256 over four governance-relevant inputs. A change
# to ANY input yields a different instance_id, which is itself recorded — so a
# swapped model, flipped guardrail, or modified control code is attributable.
algorithm: "instance_id = sha256(code_hash · config_hash · toolset_hash · model_hash)"

binding_inputs:
  code_hash:
    description: >-
      sha256 over the bytes of the governance-CORE source files — a CHANGE
      SIGNAL over the controls' core code, NOT whole-tree code integrity. A
      change to any covered file flips instance_id. The agent cannot reach
      these files to tamper them: agent/file_safety.py write-deny + the CI
      path-freeze/governance gates are the actual tamper-EVIDENCE controls;
      code_hash makes a governance-core change attributable in the audit record.
      Deliberately excludes churny non-governance files (model_tools.py,
      lliam_cli/config.py) so ordinary product edits don't reset every agent's
      identity — which would make the signal useless.
    source: agent/agent_identity.py:_CODE_SURFACE
    covers:
      - agent/governance_audit.py
      - agent/governance_audit_hooks.py
      - agent/agent_identity.py
      - agent/secret_scope.py
      - agent/file_safety.py
      - agent/redact.py
      - agent/tool_guardrails.py
      - tools/tool_policy.py
      - tools/input_integrity.py
      - lliam_cli/posture_resolver.py
      - lliam_cli/security_audit_startup.py
  config_hash:
    description: >-
      sha256 over the REDACTED canonical effective config (secrets stripped via
      the Phase-0 force-path redaction). Flips on any posture/guardrail change;
      never embeds a credential.
    source: agent/agent_identity.py:_config_hash
  toolset_hash:
    description: >-
      sha256 over the sorted resolved tool/skill name manifest for the session's
      toolset scope. Flips if a tool/skill is enabled or disabled.
    source: agent/agent_identity.py:_toolset_hash
  model_hash:
    description: >-
      sha256(provider|model). Flips on a provider or model swap. (Model-weight
      attestation is an L3 uplift; not available in this deployment.)
    source: agent/agent_identity.py:_model_manifest

usage:
  - "Stamped into every audit record `actor` (agent/governance_audit_hooks.py) — LG-IA-02 / LG-AU-04 / LG-QT-03."
  - "Emitted at startup as the NPE identity of record (config.load / agent.lifecycle events)."

fail_safe: >-
  Each input is best-effort: an unresolvable input contributes a stable
  "unknown:<name>" marker rather than raising, so identity derivation never
  breaks a run (LG-IA-02 is Detective/Directive — it labels, it does not gate).

deferred_to_remediation_pass:
  - "Per-record identity SIGNING (authenticity, not just consistency) — pairs with external anchoring (LG-AU-08-R1)."
  - "Live secrets-CLI reconcile of the security.accounts inventory (LG-IA-01)."
  - "Bitwarden managed-source migration off residual plaintext .env (LG-IA-04)."
  - "Full delegation-context module + runtime max_spawn_depth enforcement (LG-IA-10)."
  - "LG-IA-03-R1: migrate tools/terminal_tool.py TERMINAL_SSH_* reads from os.getenv to secret_scope.get_secret so the fail-closed per-profile guard actually covers the command-exec credential path (Workstream A). The _GLOBAL_ENV allowlist is now minimized to exclude TERMINAL_SSH_* (P1.4), but a direct os.getenv read still bypasses scoping until migrated. Single-profile demo/eval is unaffected; must land before any multi-profile deployment."
