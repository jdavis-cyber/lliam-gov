# evidence-register.yaml — Layered evidence register (LG-TP-08, P4.5).
#
# Purpose: the assessor-facing index mapping each control (or control family)
# to its concrete artifact, organized into the five evidence layers. Every
# artifact path must resolve to a real file in the repo (verified by the P4.5
# test suite). This is the single entry point an assessor uses to navigate
# the evidence produced through P4.5.
#
# Layers: governance | technical | operational | assessment | attestation.
# Review-by: at each phase gate and management review (LG-GV-08).

schema: lg-tp/1
owner_role: isso
classification: CUI//SP-PRIV   # template — mark per instance

layers:

  governance:
    - control: LG-GV-01
      artifacts: [docs/governance/ai-policy.md]
    - control: LG-GV-02
      artifacts: [docs/governance/intended-use.md]
    - control: LG-GV-03
      artifacts: [docs/governance/regulatory-register.yaml]
    - control: [LG-GV-04, LG-GV-05]
      artifacts: [docs/governance/roles.yaml, docs/governance/roles-raci.md]
    - control: LG-GV-06
      artifacts: [docs/governance/authorization-record.yaml]
    - control: LG-GV-10
      artifacts: [docs/governance/waiver-register.yaml]
    - control: [LG-RM-01, LG-RM-02]
      artifacts: [docs/governance/risk-assessment-process.md,
                  docs/governance/threat-risk-register.yaml]
    - control: [LG-RM-04, LG-RM-07]
      artifacts: [docs/governance/SoA.md, docs/governance/control-catalog.yaml,
                  docs/governance/poam.yaml]
    - control: [LG-RM-05, LG-RM-06]
      artifacts: [docs/governance/ai-impact-assessment.md,
                  docs/governance/high-impact-determinations.yaml]
    - control: LG-RM-09
      artifacts: [docs/governance/halt-rollback-runbook.md]
    - control: [LG-PF-01, LG-PF-04]
      artifacts: [docs/governance/privacy-policy.md,
                  docs/governance/ai-disclosure-notice.md]
    - control: LG-PF-06
      artifacts: [docs/governance/bias-risk-register.yaml]
    - control: [LG-GV-07, LG-GV-08]
      artifacts: [agent/cato_loop.py, docs/governance/management-review.md]
    - control: [LG-TP-05, LG-TP-06]
      artifacts: [docs/governance/autonomy-classification.md,
                  docs/governance/third-party-contingency.md]
    - control: LG-TP-07
      artifacts: [ci/governance-ci-gates/attestation_export.py]

  technical:
    - control: LG-CH-01
      artifacts: [cli-config.gov.yaml]
    - control: LG-CH-02
      artifacts: [lliam_cli/posture_resolver.py]
    - control: [LG-AZ-01, LG-RM-03, LG-RM-08]
      artifacts: [policy/tool-risk-policy.yaml, tools/tool_policy.py]
    - control: [LG-AU-01, LG-AU-02]
      artifacts: [agent/governance_audit.py, agent/governance_audit_hooks.py]
    - control: [LG-MP-01, LG-MP-02]
      artifacts: [policy/provider-allowlist.yaml, lliam_cli/provider_allowlist.py]
    - control: [LG-NE-01, LG-NE-02]
      artifacts: [policy/egress-allowlist.yaml, tools/egress_policy.py,
                  tools/url_safety.py]
    - control: [LG-IN-01, LG-IN-04, LG-IN-05, LG-IN-06]
      artifacts: [docs/governance/boundary-scope.md]
    - control: LG-IN-07
      artifacts: [docs/governance/SSP.md,
                  docs/governance/traceability-171r3.yaml]
    - control: [LG-QT-01, LG-QT-02]
      artifacts: [docs/governance/qms-process-maps.md]
    - control: [LG-MO-01, LG-MO-05]
      artifacts: [agent/iscm_sink.py, agent/runtime_monitors.py]

  operational:
    - control: LG-TP-01
      artifacts: [docs/governance/training-register.yaml]
    - control: LG-TP-02
      artifacts: [docs/governance/rules-of-behavior.md]
    - control: LG-TP-03
      artifacts: [docs/governance/supplier-vetting-register.md]
    - control: LG-TP-04
      artifacts: [docs/governance/shared-responsibility-matrix.yaml]
    - control: LG-CH-08
      artifacts: [docs/governance/deviation-register.yaml]
    - control: LG-SD-07
      artifacts: [docs/governance/change-record.md]
    - control: [LG-IR-01, LG-IR-05, LG-IR-08, LG-RM-09]
      artifacts: [agent/killswitch.py,
                  docs/governance/incident-response-plan.md,
                  docs/governance/halt-rollback-runbook.md]

  assessment:
    - control: LG-SD-02
      artifacts: [docs/governance/requirements-traceability.yaml]
    - control: [LG-SD-03, LG-SD-05]
      artifacts: [tests/governance/test_p45_redteam_corpus.py,
                  tests/governance/test_p2_capability_corpus.py,
                  tests/governance/test_p3_capability_corpus.py]
    - control: LG-SD-06
      artifacts: [ci/governance-ci-gates/go_no_go_gate.py]
    - control: [LG-MO-07, LG-MO-08, LG-MO-09]
      artifacts: [ci/governance-ci-gates/scheduled_redteam.py,
                  ci/governance-ci-gates/control_effectiveness.py,
                  ci/governance-ci-gates/governance_metrics.py,
                  ci/governance-ci-gates/scheduled_assurance_cron.sh]
    - control: [LG-PF-08, LG-PF-09]
      artifacts: [agent/output_monitor.py]
    - control: [LG-RM-04, LG-IN-07]
      artifacts: [ci/governance-ci-gates/soa_gate.py,
                  ci/governance-ci-gates/ssp_reconciliation_gate.py]
    - control: LG-GV-05
      artifacts: [ci/governance-ci-gates/sod_check.py]
    - control: LG-AU-08
      artifacts: [ci/governance-ci-gates/audit_chain_selftest.py]
    - control: [LG-SD-01, LG-CH-03]
      artifacts: [ci/governance-ci-gates/path_freeze_gate.py,
                  ci/governance-ci-gates/baseline_drift_gate.py]

  attestation:
    - control: LG-SD-04
      artifacts: [.github/CODEOWNERS, docs/governance/branch-protection.md]
    - control: [LG-MP-06, LG-SS-06]
      artifacts: [model_manifest.yaml]
    - control: LG-IA-02
      artifacts: [docs/governance/agent_identity.yaml]
    - control: LG-TP-08
      artifacts: [docs/governance/evidence-register.yaml]
