# fairness-evaluations.yaml — Fairness evaluation records (LG-PF-07, P4.4).
#
# Purpose: the evaluation records the fairness CI gate
# (ci/governance-ci-gates/fairness_gate.py) matches against the CURRENT
# sha256 of the fairness-relevant artifacts (model_manifest.yaml,
# policy/provider-allowlist.yaml, lliam_cli/default_soul.py). A change to
# any of those without a new matching record here fails CI — fairness
# re-evaluation is unskippable on model/provider/prompt change.
#
# Record schema: {id, date, evaluator_role, method,
#                 person_affecting_use_cases, outcome, notes, baseline{...}}
# Valid outcomes: pass | pass_with_conditions.

schema: lg-pf/1
owner_role: ai_risk_owner
classification: CUI//SP-PRIV   # template — mark per instance

