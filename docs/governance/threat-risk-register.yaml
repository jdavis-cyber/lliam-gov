# threat-risk-register.yaml — Living agent-threat risk register
# (LG-RM-02 / LG-RM-08, P4.2 / AI-494).
#
# Purpose: the machine-readable risk register of record, adapted from the
# governance package's populated Risk_Register.md (17 risks, seeded from the
# Agentic Threat Model §19 rollup P1-P16). Each risk carries the mandatory
# agent-threat class tags, inherent/residual ratings, mitigating LG-*
# controls (validated against docs/governance/control-catalog.yaml by the
# P4.2 test suite), the accountable owner ROLE (bound to a principal via
# governance.role_bindings), and treatment status reflecting the P4.2 build
# state. Statuses: open | in_treatment | monitored | accepted_poam.
#
# Method: docs/governance/risk-assessment-process.md (LG-RM-01).
# Acceptance: residual risk accepted 2026-07-16 per
# docs/governance/authorization-record.yaml (LG-ATO-2026-001) and the signed
# block in docs/governance/ai-impact-assessment.md §11.
#
# Review-by: at each phase verify gate and at management review (LG-GV-08).

