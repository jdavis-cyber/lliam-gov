# regulatory-register.yaml — Legal / regulatory / contractual obligations
# bound to enforced controls (LG-GV-03, P4.1 / AI-493).
#
# Purpose: the obligations register of record. Every obligation maps
# obligation -> LG-* control(s) -> REAL enforced config point(s). The CI gate
# ci/governance-ci-gates/regulatory_reconciliation_gate.py fails closed when
# any binding does not resolve (missing key, file, or module), when a
# 'partial' obligation carries no poam_ref, or when an obligation has no
# binding at all. Startup presence is asserted by
# lliam_cli/security_audit_startup.enforce_governance_artifacts_at_startup.
#
# Config-point kinds:
#   config_key — dotted key that must exist in cli-config.gov.yaml
#   file       — repo-relative path that must exist
#   module     — repo-relative .py that must exist (the enforcing code)
#
# Review-by: 2027-07-16 (annual, or on contract/regulation change).

schema: lg-gv/1
owner: Lliam-GOV Program
classification: CUI//SP-PRIV   # template — mark per instance
review_by: 2027-07-16

obligations:
  # ---------------------------------------------------------------- DFARS ---
  - id: REG-DFARS-7012-B
    source: DFARS 252.204-7012(b)
    obligation: >-
      Provide adequate security for covered defense information on covered
      contractor information systems — implement NIST SP 800-171 (r3 floor).
    controls: [LG-CH-01, LG-CH-02, LG-CH-09]
    status: implemented
    config_points:
      - {kind: config_key, key: security.posture}
      - {kind: config_key, key: security.posture_findings_blocking}
      - {kind: module, path: lliam_cli/posture_resolver.py}
      - {kind: file, path: docs/governance/baseline-critical-keys.yaml}

  - id: REG-DFARS-7012-CG
    source: DFARS 252.204-7012(c)-(g)
    obligation: >-
      Rapidly report cyber incidents to DoD via DIBNet within 72 hours;
      preserve images/artifacts and support damage assessment.
    controls: [LG-AU-01, LG-AU-08, LG-IR-02]
    status: partial
    poam_ref: "POAM-P5-IR — IR runbook + DIBNet 72-hr reporting procedure lands at P5.3 (AI-501); tamper-evident evidence trail already enforced"
    config_points:
      - {kind: config_key, key: audit.ledger_enabled}
      - {kind: config_key, key: audit.fail_closed}
      - {kind: module, path: agent/governance_audit.py}

  # --------------------------------------------------- NIST SP 800-171 r3 ---
  - id: REG-171R3-AC
    source: NIST SP 800-171 r3 §03.01 (Access Control)
    obligation: >-
      Limit system access and enforce least privilege over tool execution,
      including separation of duties on high-risk approvals.
    controls: [LG-AZ-02, LG-AZ-11, LG-HO-01, LG-GV-05]
    status: implemented
    config_points:
      - {kind: config_key, key: security.tool_risk_policy}
      - {kind: config_key, key: security.tool_denylist}
      - {kind: config_key, key: security.deny_on_no_approver}
      - {kind: file, path: policy/tool-risk-policy.yaml}
      - {kind: module, path: tools/tool_policy.py}

  - id: REG-171R3-AU
    source: NIST SP 800-171 r3 §03.03 (Audit & Accountability)
    obligation: >-
      Create and retain tamper-evident audit records sufficient to trace
      actions to accountable principals; protect against unrecorded activity.
    controls: [LG-AU-01, LG-AU-02, LG-AU-08, LG-AU-09]
    status: implemented
    config_points:
      - {kind: config_key, key: audit.ledger_enabled}
      - {kind: config_key, key: audit.chokepoint_required}
      - {kind: module, path: agent/governance_audit.py}
      - {kind: module, path: agent/governance_audit_hooks.py}

  - id: REG-171R3-CM
    source: NIST SP 800-171 r3 §03.04 (Configuration Management)
    obligation: >-
      Establish and maintain a documented secure baseline; detect and block
      unauthorized drift from the approved configuration.
    controls: [LG-CH-01, LG-CH-03, LG-CH-08]
    status: implemented
    config_points:
      - {kind: config_key, key: security.posture_findings_blocking}
      - {kind: module, path: ci/governance-ci-gates/baseline_drift_gate.py}
      - {kind: file, path: ci/governance-ci-gates/path-freeze-manifest.yaml}
      - {kind: file, path: docs/governance/deviation-register.yaml}

  - id: REG-171R3-IA
    source: NIST SP 800-171 r3 §03.05 (Identification & Authentication)
    obligation: >-
      Identify and authenticate users and processes; no default credentials;
      authenticated control plane for any network-accessible surface.
    controls: [LG-IA-01, LG-IA-05, LG-IA-06, LG-IA-11]
    status: implemented
    config_points:
      - {kind: config_key, key: security.no_default_credentials}
      - {kind: config_key, key: security.api_server_key_required}
      - {kind: config_key, key: security.require_operator_auth}
      - {kind: module, path: agent/agent_identity.py}

  - id: REG-171R3-IR
    source: NIST SP 800-171 r3 §03.06 (Incident Response)
    obligation: >-
      Establish operational incident-handling capability with containment
      and recovery; test the response capability.
    controls: [LG-IR-01, LG-RM-09]
    status: partial
    poam_ref: "POAM-P5-IR — kill-switch/containment/recovery runbook + tests land at P5.3 (AI-501); interrupt primitive and audit trail already present"
    config_points:
      - {kind: module, path: tools/interrupt.py}
      - {kind: config_key, key: audit.ledger_enabled}

  - id: REG-171R3-SC
    source: NIST SP 800-171 r3 §03.13 (System & Communications Protection)
    obligation: >-
      Deny-by-default boundary communications; route CUI inference only to
      approved in-boundary providers over verified TLS.
    controls: [LG-NE-01, LG-MP-01, LG-MP-02, LG-IA-08]
    status: implemented
    config_points:
      - {kind: config_key, key: security.egress}
      - {kind: config_key, key: security.provider_allowlist_enforce}
      - {kind: config_key, key: security.require_tls}
      - {kind: file, path: policy/egress-allowlist.yaml}
      - {kind: file, path: policy/provider-allowlist.yaml}

  - id: REG-171R3-SI
    source: NIST SP 800-171 r3 §03.14 (System & Information Integrity)
    obligation: >-
      Identify and defend against malicious content and prompt-injection;
      monitor security advisories; fail closed on scanner outage.
    controls: [LG-PI-01, LG-PI-02, LG-CH-02, LG-SS-04]
    status: implemented
    config_points:
      - {kind: config_key, key: security.tirith_fail_open}
      - {kind: config_key, key: security.input_trust}
      - {kind: module, path: tools/tirith_security.py}
      - {kind: module, path: lliam_cli/security_advisories.py}

  # ------------------------------------------------------------- CMMC L2 ---
  - id: REG-CMMC-L2
    source: CMMC 2.0 Level 2 (32 CFR §170)
    obligation: >-
      Maintain assessment-ready evidence of 800-171 practice implementation:
      documented scope/boundary, SoA, SSP, and POA&M.
    controls: [LG-GV-02, LG-RM-04, LG-IN-05]
    status: partial
    poam_ref: "POAM-P4-DOCS — SoA + POA&M land at P4.2 (AI-494); boundary + SSP at P4.3 (AI-495); intended-use + deviation register already in force"
    config_points:
      - {kind: file, path: docs/governance/intended-use.md}
      - {kind: file, path: docs/governance/deviation-register.yaml}
      - {kind: file, path: docs/governance/roles.yaml}

  # ---------------------------------------------------------- OMB M-25-21 ---
  - id: REG-M2521-CAIO
    source: OMB M-25-21 §3(b) (Chief AI Officer)
    obligation: >-
      Designate an accountable Chief AI Officer with authority over AI
      governance, risk acceptance, and waiver/determination decisions.
    controls: [LG-GV-04, LG-GV-05]
    status: implemented
    config_points:
      - {kind: config_key, key: governance.role_bindings}
      - {kind: file, path: docs/governance/roles.yaml}
      - {kind: module, path: ci/governance-ci-gates/sod_check.py}

  - id: REG-M2521-HIA
    source: OMB M-25-21 §4(c) (High-impact AI minimum practices)
    obligation: >-
      Apply minimum risk-management practices to high-impact AI use: human
      oversight on consequential actions, documented determinations, and
      signed risk acceptance before enablement.
    controls: [LG-HO-01, LG-GV-05, LG-RM-06]
    status: partial
    poam_ref: "POAM-P4-RM — signed high-impact determinations land at P4.2 (AI-494); HITL approval gating already enforced at the tool chokepoint"
    config_points:
      - {kind: config_key, key: security.deny_on_no_approver}
      - {kind: config_key, key: security.require_authenticated_approver}
      - {kind: module, path: tools/hitl_oversight.py}

  - id: REG-M2521-FAILSAFE
    source: OMB M-25-21 §4(c) (Human oversight with fail-safe)
    obligation: >-
      Maintain a documented, tested capability to promptly disengage or
      deactivate the AI system (kill-switch / fail-safe).
    controls: [LG-RM-09, LG-AZ-12]
    status: partial
    poam_ref: "POAM-P5-IR — documented+tested kill-switch with clean restore lands at P5.3 (AI-501); runaway-loop hard stop already enforced"
    config_points:
      - {kind: config_key, key: tool_loop_guardrails.hard_stop_enabled}
      - {kind: module, path: tools/interrupt.py}

  # ---------------------------------------------------------- Contractual ---
  - id: REG-MIT-UPSTREAM
    source: MIT License — Hermes Agent (Nous Research)
    obligation: >-
      Retain upstream copyright and permission notices in the governed fork
      and its distributions.
    controls: [LG-GV-03]
    status: implemented
    config_points:
      - {kind: file, path: LICENSE}
      - {kind: file, path: README.md}
