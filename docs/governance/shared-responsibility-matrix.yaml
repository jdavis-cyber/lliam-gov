# shared-responsibility-matrix.yaml — Five-layer shared-responsibility matrix
# (LG-TP-04, P4.5). Exactly one accountable party per component.
#
# Layers: facility_host | platform_os | inference_provider | agent_runtime |
#         governance_aims. Owners are governance.role_bindings roles or the
# named inherited/external party. "Accountable" = single owner; "responsible"
# = supporting parties.
#
# Review-by: at supplier/provider change and at management review (LG-GV-08).

schema: lg-tp/1
owner_role: isso
classification: CUI//SP-PRIV   # template — mark per instance

components:
  - component: Physical facility & environmental controls
    layer: facility_host
    accountable: inherited:hosting-facility-ATO
    responsible: [isso]
    boundary: Inherited (SSP §03.10)

  - component: Host OS, patching, hardware, network fabric
    layer: platform_os
    accountable: inherited:host-OM
    responsible: [isso]
    boundary: Inherited (SSP §03.07/03.10)

  - component: Inference providers (Bedrock GovCloud, local LM Studio/Ollama/vLLM)
    layer: inference_provider
    accountable: ai_risk_owner
    responsible: [isso]
    boundary: Vetted via policy/provider-allowlist.yaml + supplier-vetting-register.md (LG-TP-03); residency/no-train agreements are allowlist-entry evidence

  - component: MCP servers & third-party skills
    layer: inference_provider
    accountable: ai_risk_owner
    responsible: [isso, engineer]
    boundary: Deny-by-default allowlist (policy/mcp-allowlist.yaml) + signed skill attestation

  - component: Agent runtime (tools, memory, audit ledger, routing)
    layer: agent_runtime
    accountable: isso
    responsible: [engineer]
    boundary: The governed in-boundary surface; PDP-mediated, ledger-audited

  - component: Kill-switch / containment
    layer: agent_runtime
    accountable: killswitch_owner
    responsible: [isso]
    boundary: tools/interrupt.py + halt-rollback-runbook.md (LG-RM-09)

  - component: HITL approval decisions
    layer: agent_runtime
    accountable: approver
    responsible: [engineer]
    boundary: Approver != Engineer (SoD, non-waivable)

  - component: AIMS management system (policy, risk, authorization, review)
    layer: governance_aims
    accountable: caio
    responsible: [isso, ai_risk_owner]
    boundary: Top-management layer; CAIO signs high-impact + waivers + re-authorization

  - component: Independent audit & control reconciliation
    layer: governance_aims
    accountable: auditor
    responsible: []
    boundary: SoD-independent of every reviewed party (LG-GV-05)
