# bias-risk-register.yaml — Bias risk register per NIST SP 1270
# (LG-PF-06, P4.4 / AI-496).
#
# Purpose: the named-accountability register for the three SP 1270 bias
# classes — systemic, statistical/computational, and human (incl. automation
# bias) — as they manifest in an autonomous tool-using agent. Owners are
# governance.role_bindings roles. Consumed by the fairness CI gate
# (ci/governance-ci-gates/fairness_gate.py): a missing/empty register or an
# ownerless entry fails the gate.
#
# Person-affecting determination: the authorized eval mission scope
# (docs/governance/intended-use.md) contains no person-affecting use case
# (no benefits/eligibility/employment/law-enforcement decisions about
# individuals). Any future person-affecting use case requires a new
# LG-RM-06 determination + fairness evaluation before enablement.
#
# Review-by: at each fairness evaluation and management review (LG-GV-08).

schema: lg-pf/1
owner_role: ai_risk_owner
classification: CUI//SP-PRIV   # template — mark per instance

risks:
  - id: BR-01
    bias_class: systemic
    context: >-
      Foundation models served by allowlisted providers embed societal/
      institutional biases from their training corpora; the agent inherits
      them in analysis, drafting, and code-review outputs.
    owner_role: ai_risk_owner
    mitigation: >-
      Provider/model vetting with model cards required for eligibility
      (LG-MP-05); grounding/citation verification for tool-driven decisions
      (LG-QT-05); fairness re-evaluation on any model/provider/prompt change
      (fairness_gate.py); human review of consequential outputs (LG-HO-01).
    controls: [LG-MP-05, LG-QT-05, LG-PF-07, LG-HO-01]

  - id: BR-02
    bias_class: statistical
    context: >-
      Statistical/computational bias in model outputs (skewed error rates
      across content domains, languages, or name/entity classes) can
      propagate into summaries, classifications, and generated code.
    owner_role: ai_risk_owner
    mitigation: >-
      Quality objectives measure output conformity (LG-QT-02); nonconforming
      outputs are blocked/quarantined and ledger-recorded (LG-QT-04);
      deployed-output bias monitoring lands P5.2 (LG-PF-08, POAM-P5-EVAL).
    controls: [LG-QT-02, LG-QT-04, LG-PF-08]

  - id: BR-03
    bias_class: human
    context: >-
      Automation bias: operators over-trust agent outputs and rubber-stamp
      approval prompts; anchoring on confident-but-wrong agent assertions
      (the LG-RM-02 R-16 confabulation coupling).
    owner_role: caio
    mitigation: >-
      Just-in-time risk rationale at every approval prompt (LG-HO-08);
      anti-fatigue rate-limiting/batching of prompts (LG-HO-07); appeal/
      override and human-handoff channel (LG-HO-09); role-based training
      acknowledgement (LG-TP-01, P4.5).
    controls: [LG-HO-07, LG-HO-08, LG-HO-09]

  - id: BR-04
    bias_class: human
    context: >-
      Interpretation bias in AI-generated artifacts: downstream readers
      mistake synthetic content for authoritative human work product.
    owner_role: caio
    mitigation: >-
      Provenance/synthetic-content disclosure stamped on AI-generated
      artifacts (LG-QT-07); the AI-disclosure notice on operator surfaces
      (LG-PF-04, docs/governance/ai-disclosure-notice.md).
    controls: [LG-QT-07, LG-PF-04]
